<h1 class="mb-5">
  @if (isEditMode) {
    Editar terapia
  } @else {
    Nueva terapia
  }
</h1>

<div class="admin-card">
  <div class="grid">
    <div class="col-12">
      <label> Título </label>

      <input pInputText class="w-full mt-2" [(ngModel)]="therapy.title" />
    </div>

    <div class="col-12">
      <label> Descripción corta </label>

      <input pInputText class="w-full mt-2" [(ngModel)]="therapy.description" />
    </div>

    <div class="col-12">
      <label> Descripción larga </label>

      <textarea
        pTextarea
        rows="8"
        class="w-full mt-2"
        [(ngModel)]="therapy.longDescription"
      ></textarea>
    </div>

    <div class="col-6">
      <label> Duración </label>

      <input
        pInputText
        type="number"
        class="w-full mt-2"
        [(ngModel)]="therapy.duration"
      />
    </div>

    <div class="col-6">
      <label> Precio </label>

      <input
        pInputText
        type="number"
        class="w-full mt-2"
        [(ngModel)]="therapy.price"
      />
    </div>
  </div>
  <div class="col-12 mt-4">
    <div class="flex align-items-center gap-3">
      <label> Activa </label>

      <p-toggleswitch [(ngModel)]="therapy.active" />
    </div>
  </div>

  <div class="flex gap-3 mt-6">
    <p-button label="Guardar" (onClick)="save()" />

    <a routerLink="/dashboard/therapies">
      <p-button label="Cancelar" severity="secondary" />
    </a>
  </div>
</div>
