<section class="py-8 px-4 lg:px-8">
  <div class="max-w-screen-xl mx-auto">
    <page-hero
      title="Talleres"
      description="Talleres presenciales orientados al bienestar, crecimiento personal y acompañamiento emocional."
    />

    <div class="grid">
      @for (workshop of workshops; track workshop.id) {
        <div class="col-12 md:col-6 lg:col-4 mb-4">
          <info-card
            [title]="workshop.title"
            [description]="workshop.description"
            [badge]="'Taller'"
            [meta]="workshop.date | dateEs"
            [price]="workshop.price + ' €'"
            [link]="'/workshops/' + workshop.id"
          />
        </div>
      }
    </div>
  </div>
</section>
