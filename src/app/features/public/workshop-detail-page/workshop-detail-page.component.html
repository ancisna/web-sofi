<section class="py-8 px-4 lg:px-8">
  <div class="max-w-screen-lg mx-auto">
    @if (workshop) {
      <div class="hero-eyebrow mb-3 text-sm">Taller</div>

      <h1 class="mb-4">
        {{ workshop.title }}
      </h1>

      <div class="flex gap-4 mb-5 hero-text">
        <div>
          📅
          {{ workshop.date }}
        </div>

        <div>
          {{ workshop.price }}
          €
        </div>
      </div>

      <p class="text-lg line-height-4 mb-6">
        {{ workshop.longDescription }}
      </p>
    }
  </div>
</section>
