<page-hero
  title="Contacto"
  description="
        Puedes reservar sesiones,
        consultar dudas o solicitar
        información por teléfono
        o correo electrónico.
    "
  [compact]="true"
/>

<section class="px-4 pb-4 lg:px-8">
  <div class="max-w-screen-lg mx-auto">
    <div class="contact-card">
      <div class="contact-content">
        <h2 class="mb-4">Reserva o información</h2>

        <p class="hero-text mb-5">
          Estoy disponible para consultas, información sobre terapias, talleres
          y acompañamiento.
        </p>

        <div class="mb-4">
          <strong>WhatsApp / Teléfono</strong>
          <div>681 998 181</div>
        </div>

        <div class="mb-5">
          <strong>Email</strong>
          <div>sofiam.reyes.roson@gmail.com</div>
        </div>

        <div class="flex flex-column sm:flex-row gap-3">
          <a href="https://wa.me/34681998181" target="_blank" rel="noopener">
            <p-button label="WhatsApp" icon="pi pi-whatsapp" />
          </a>

          <a href="mailto:sofiam.reyes.roson@gmail.com">
            <p-button label="Email" severity="secondary" icon="pi pi-envelope" />
          </a>
        </div>
      </div>

      <img
        src="https://picsum.photos/900/800"
        alt="Contacto"
        class="contact-image"
      />
    </div>
  </div>
</section>
