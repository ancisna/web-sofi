<div class="flex flex-column min-h-screen">
  <header>
    <!-- CONTACT BAR -->
    <div
      class="bg-sofi-primary-soft px-3 py-2"
      style="background: var(--sofi-primary-soft)"
    >
      <div
        class="flex justify-content-end align-items-center gap-4 max-w-screen-xl mx-auto"
      >
        <a href="mailto:info@sofiareyespsicologa.com" class="topbar-link">
          <i class="pi pi-envelope"></i>
          <span>Escríbeme</span>
        </a>
        <a href="tel:+34688955546" class="topbar-link">
          <i class="pi pi-phone"></i>
          <span>688 955 546</span>
        </a>

        @if (auth.user()) {
          <div class="topbar-separator"></div>
          <span class="topbar-logout" (click)="logout()">
            <i class="pi pi-sign-out"></i> Cerrar sesión
          </span>
        }
      </div>
    </div>

    <!-- NAVBAR -->
    <div class="navbar-main px-4 py-3 border-bottom-1 border-200 surface-sofi">
      <div
        class="flex relative justify-content-between align-items-center max-w-screen-xl mx-auto"
      >
        <!-- LOGO -->

        <div class="flex align-items-center gap-3">
          <div
            class="text-3xl font-semibold logo-brand text-sofi-primary"
            style="color: var(--sofi-primary)"
          >
            <!-- Web Sofi -->
            <div class="flex align-items-center gap-3">
              <img
                src="branding/logo-horizontal.svg"
                alt="Sofía Reyes Psicóloga"
                class="logo-navbar"
              />
            </div>
          </div>
        </div>

        <!-- DESKTOP MENU -->

        <nav class="hidden lg:flex gap-5 align-items-center">
          <a routerLink="/">Inicio</a>
          <a routerLink="/therapies"> Terapias </a>
          <a routerLink="/workshops"> Talleres </a>
          <a routerLink="/articles"> Artículos </a>
          <a routerLink="/contact"> Contactar </a>
          <a routerLink="/about"> Sobre mí </a>
          <a routerLink="/login" title="Acceso privado">
            <i class="pi pi-lock text-color-secondary"></i>
          </a>
        </nav>

        <!-- MOBILE BUTTON -->

        <p-button
          icon="pi pi-bars"
          severity="secondary"
          [rounded]="true"
          [text]="true"
          class="lg:hidden"
          (onClick)="toggleMobileMenu()"
        />
        @if (mobileMenuOpen()) {
          <div
            class="absolute right-0 top-100 mt-3 w-16rem surface-overlay shadow-4 border-round p-4 z-3"
          >
            <button
              class="absolute top-0 right-0 m-2 border-none bg-transparent cursor-pointer"
              (click)="toggleMobileMenu()"
            >
              ✕
            </button>

            <nav class="flex flex-column gap-3 pt-4">
              <a routerLink="/" (click)="toggleMobileMenu()"> Inicio </a>

              <a routerLink="/therapies" (click)="toggleMobileMenu()">
                Terapias
              </a>

              <a routerLink="/workshops" (click)="toggleMobileMenu()">
                Talleres
              </a>

              <a routerLink="/articles" (click)="toggleMobileMenu()">
                Artículos
              </a>
              <a routerLink="/contact" (click)="toggleMobileMenu()">
                Contactar
              </a>
              <a routerLink="/about" (click)="toggleMobileMenu()"> Sobre mí </a>
              <a routerLink="/login" (click)="toggleMobileMenu()">
                <i class="pi pi-lock"></i> Acceso privado
              </a>
            </nav>
          </div>
        }
      </div>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>

  <footer class="footer-main px-4 py-4">
    <div class="max-w-screen-xl mx-auto grid align-items-center">
      <!-- LEFT -->

      <div class="col-12 md:col-3 text-center md:text-left">
        <img
          src="branding/logo-horizontal.svg"
          alt="Sofía Reyes Psicóloga"
          class="footer-logo"
        />
      </div>

      <!-- CENTER -->

      <div class="col-12 md:col-6 text-center">
        <nav class="flex flex-wrap justify-content-center gap-3 mb-3">
          <a routerLink="/">Inicio</a>

          <a routerLink="/about"> Sobre mí </a>

          <a routerLink="/therapies"> Terapias </a>

          <a routerLink="/workshops"> Talleres </a>

          <a routerLink="/contact"> Contacto </a>
        </nav>

        <div class="footer-copy">© 2026 Sofía Reyes Psicóloga</div>
      </div>

      <!-- RIGHT -->

      <div class="col-12 md:col-3 text-center md:text-right">
        <div class="footer-socials">
          <a href="#">
            <i class="pi pi-instagram"></i>
          </a>

          <a href="#">
            <i class="pi pi-linkedin"></i>
          </a>
        </div>
      </div>
    </div>
  </footer>
